name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish unnotarized DMG
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches MARKETING_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | awk '{print $2}' | tr -d '"')
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME != v$VERSION in project.yml"; exit 1; }

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build and package unnotarized DMG
        run: ./scripts/release.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jot-DMG
          path: build/release/*.dmg
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            This build is ad-hoc signed, not Developer ID-signed or notarized by Apple.
            macOS Gatekeeper may block it on first launch.
