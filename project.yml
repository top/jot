# xcodegen project definition — regenerate the project with `xcodegen generate`.
# The .xcodeproj is NOT checked in; this file is the source of truth.
name: Jot
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

packages:
  JotCore:
    path: JotCore

targets:
  Jot:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_NAME: Jot
        PRODUCT_BUNDLE_IDENTIFIER: org.ie9.app
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_ENTITLEMENTS: App/Jot.entitlements
        ENABLE_HARDENED_RUNTIME: NO # enabled for notarized release builds (M8)
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.5.3"
        CURRENT_PROJECT_VERSION: "11"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    sources:
      - path: App/Sources
      - path: App/Resources/Jot.icns
      # Folder references (blue folders) so bundle subdirectory structure is preserved:
      # Contents/Resources/Fonts/GoogleSansFlex/… etc.
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: App/Resources/Sounds
        type: folder
        buildPhase: resources
    dependencies:
      - package: JotCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Jot
        CFBundleIconFile: Jot
        # Without these the generated plist keeps xcodegen's default 1.0, so the
        # About panel and the DMG filename disagree about the version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true # menu bar app: no Dock icon
        NSMicrophoneUsageDescription: Jot records audio while you hold the dictation key, so it can transcribe what you say.
        NSHumanReadableCopyright: "Copyright 2026 Google LLC. Apache License 2.0. This is not an officially supported Google product."
        LSMinimumSystemVersion: "14.0"
        CFBundleURLTypes:
          - CFBundleURLName: org.ie9.app.url
            CFBundleURLSchemes: [jot]
    scheme:
      testTargets: []
      gatherCoverageData: false
